version: '3'
services:
  redmine:
    image: redmine:7.0-alpine3.24
    restart: unless-stopped
    environment:
      - REDMINE_DB_POSTGRES=db
      - REDMINE_DB_USERNAME=${REDMINE_DB_USERNAME}
      - REDMINE_DB_PASSWORD=${REDMINE_DB_PASSWORD}
    ports:
      - ${REDMINE_PORT}:3000
    volumes:
      - web:/usr/src/redmine/files
  db:
    image: postgres:15.1
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${REDMINE_DB_USERNAME}
      - POSTGRES_PASSWORD=${REDMINE_DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
      - db_backup:/var/lib/postgresql/db_backup
volumes:
  web:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/lukjarz/workspace/redmine/web
  db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/lukjarz/workspace/redmine/db
  db_backup:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/lukjarz/workspace/redmine/db_backup
